spring.application.name=demo
# Default admin seeded at startup if absent; override the password via APP_ADMIN_PASSWORD
app.admin.username=admin
app.admin.password=${APP_ADMIN_PASSWORD:admin123}

# PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB:mydb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:myuser}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always

# devtools
spring.devtools.restart.enabled=true
#thymeleaf 
spring.thymeleaf.cache=false

