spring.application.name=demo
# Default admin seeded at startup if absent; override the password via APP_ADMIN_PASSWORD
app.admin.username=admin
app.admin.password=${APP_ADMIN_PASSWORD:admin123}

# H2 database
spring.datasource.url=jdbc:h2:file:${user.dir}/data/demodb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# devtools
spring.devtools.restart.enabled=true
#thymeleaf 
spring.thymeleaf.cache=false

