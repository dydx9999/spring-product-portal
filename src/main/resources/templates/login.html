<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="site-auth-page">
    <main class="w-100" style="max-width: 420px;">
        <!-- Sign-in heading -->
        <div class="mb-4 text-center">
            <p class="page-eyebrow text-uppercase small fw-semibold mb-2">Spring Product Portal</p>
            <h1 class="h2 mb-2">Sign in</h1>
            <p class="text-secondary mb-0">Access your account to continue.</p>
        </div>
        <!-- Sign-in form and account links -->
        <section class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <form th:action="@{/login}" th:object="${loginForm}" method="post" class="site-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- Authentication error message -->
                    <div th:if="${param.error}" class="alert alert-danger" role="alert">Invalid username or password
                    </div>

                    <div class="form-floating">
                        <input type="text" class="form-control" id="floatingInput" placeholder="Username"
                            th:field="*{username}">
                        <label for="floatingInput">Username</label>
                    </div>
                    <div class="form-floating">
                        <input type="password" class="form-control" id="floatingPassword" placeholder="Password"
                            th:field="*{password}">
                        <label for="floatingPassword">Password</label>
                    </div>
                    <button class="w-100 btn btn-primary mt-3" type="submit">Sign in</button>

                    <div class="d-grid gap-2 mt-3">
                        <a th:href="@{/users}" class="btn btn-outline-secondary">View user records</a>
                        <a th:href="@{/register}" class="btn btn-outline-secondary">Register</a>
                    </div>

                </form>
            </div>
        </section>
    </main>
</body>

</html>
