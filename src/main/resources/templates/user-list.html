<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
        <link rel="stylesheet"
            th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="site-page">
    <div th:replace="~{fragments/fragments :: site-navigation('')}"></div>
    <main class="container py-4">
            <header
                class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div>
                    <p
                        class="page-eyebrow text-uppercase small fw-semibold mb-2">Administration</p>
                <h1 class="h2 mb-0">Users</h1>
            </div>
            <div class="d-flex flex-wrap gap-2">
                    <a th:href="@{/login}"
                        class="btn btn-outline-secondary">Login</a>
                    <a th:href="@{/register}"
                        class="btn btn-primary">Register</a>
                    <a th:href="@{/dashboard}"
                        class="btn btn-outline-secondary">View dashboard</a>
            </div>
        </header>
        <!-- User records table -->
        <section class="card border-0 shadow-sm">
            <div class="table-responsive">
                    <table class="table table-hover site-table mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Username</th>
                            <th scope="col">Balance</th>
                            <th scope="col">Role</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.username}"></td>
                            <td th:text="${user.balance}"></td>
                            <td th:text="${user.role}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
                <div
                    th:replace="~{fragments/fragments :: pagination(${userPager}, 'User pages')}"></div>
        </section>
    </main>
    <footer class="container py-3">
        <div th:replace="~{fragments/fragments :: site-footer}"></div>
    </footer>

</body>

</html>
