<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
</head>

<body>


    <div th:replace="~{fragments/fragments :: site-navigation}"></div>
    <h1>Product Catalog</h1>
    <p>Currently logged in as: <strong><span th:text="${username}">Username</span></strong></p>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>SKU</th>
                <th>Actions</th>

            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>
                <td th:text="${product.productName}"></td>
                <td th:text="${product.productPrice}"></td>
                <td th:text="${product.productQuantity}"></td>
            </tr>
        </tbody>
    </table>


    <a th:href="@{/products/product-form}">Add new product</a>
    <a th:href="@{/products/product-search}">Search for a product</a>

</body>

</html>
