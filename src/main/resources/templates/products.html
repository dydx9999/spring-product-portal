<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>


<body class="site-page">
    <div th:replace="~{fragments/fragments :: site-navigation('products')}"></div>
    <main class="container py-4">
        <header class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div>
                <p class="page-eyebrow text-uppercase small fw-semibold mb-2">Inventory</p>
                <h1 class="h2 mb-2">Product catalog</h1>
                <p class="text-secondary mb-0">Signed in as <strong><span th:text="${username}">Username</span></strong>
                    <span class="ms-1" th:if="${isAdmin}">(Admin)</span><span class="ms-1"
                        th:if="${isUser}">(User)</span><span class="ms-1" th:if="${isVendor}">(Vendor)</span>
                </p>
            </div>
            <div>
                <a th:if="${isVendor}" th:href="@{/products/add-product}" class="btn btn-primary">Add
                    product</a>
                <a th:unless="${isVendor}" th:href="@{/cart/view}" class="btn btn-primary">View cart</a>
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenu2"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        Filter
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenu2">
                        <li><button class="dropdown-item" type="button">$ Price (Ascending)</button></li>
                        <li><button class="dropdown-item" type="button">Another action</button></li>
                        <li><button class="dropdown-item" type="button">Something else here</button></li>
                    </ul>
                </div>
            </div>
        </header>

        <div th:if="${outOfStockMessage}" class="alert alert-warning" role="status" th:text="${outOfStockMessage}">
        </div>
        <div th:if="${deleteSuccess}" class="alert alert-success" role="status" th:text="${deleteSuccess}"></div>
        <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>

        <div class="d-flex align-items-center gap-2 mb-3">
            <!-- Product catalog count  -->
            <button type="button" class="btn btn-primary">
                Products <span class="badge text-bg-secondary" th:text="${productCount}">0</span>
            </button>
            <!-- Out of stock products alert  -->

            <button type="button" class="btn btn-primary">
                Out of stock <span class="badge text-bg-danger" th:text="${outOfStockProducts}">0</span>
            </button>

        </div>

        <section class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped site-table mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Name</th>
                            <th scope="col">Price</th>
                            <th scope="col">Quantity</th>
                            <th scope="col">SKU</th>
                            <th th:if="${isVendor}" th:text="Notes" scope="col">Notes</th>
                            <th scope="col" class="actions-column">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td th:text="${product.id}"></td>
                            <td th:text="${product.productName}"></td>
                            <td>$<span th:text="${product.productPrice}"></span></td>
                            <td th:text="${product.productQuantity}"></td>
                            <td th:text="${product.productSKU}"></td>
                            <td th:if="${isVendor}" <span th:text="${product.vendorNotes}"></span></td>
                            <td class="actions-column">
                                <form class="product-action-form" sec:authorize="hasRole('ADMIN')"
                                    th:action="@{/products/delete/{id}(id=${product.id})}" method="post">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                                </form>
                                <form class="product-action-form" sec:authorize="hasRole('VENDOR')"
                                    th:action="@{/products/delete/{id}(id=${product.id})}" method="post">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                                </form>
                                <form class="product-action-form" sec:authorize="hasRole('USER')"
                                    th:if="${product.productQuantity > 0}"
                                    th:action="@{/products/purchase/{id}(id=${product.id})}" method="post">
                                    <input type="number" name="quantity" value="1" min="1"
                                        th:attr="max=${product.productQuantity}" required>
                                    <button class="btn btn-sm btn-outline-primary" type="submit">Add to cart</button>
                                </form>
                                <form class="product-action-form" sec:authorize="hasRole('VENDOR')"
                                    th:action="@{/products/update/{id}(id=${product.id})}" method="get">
                                    <button class="btn btn-sm btn-outline-primary" type="submit">Update</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>
    <footer class="container py-3">
        <div th:replace="~{fragments/fragments :: site-footer}"></div>
    </footer>

</body>

</html>
