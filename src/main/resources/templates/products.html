<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>


<body>


    <div th:replace="~{fragments/fragments :: site-navigation}"></div>
    <h1>Product Catalog</h1>
    <p>Currently logged in as: <strong><span th:text="${username}">Username</span></strong></p>
    <p>Roles: <strong><span th:if="${isAdmin}" th:text="Admin">Role</span></strong></p>
    <p>Currently showing: <strong><span th:text="${productCount}">0</span> <span
                th:text="${productCount == 1 ? 'entry' : 'entries'}">entries</span></strong></p>


    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>SKU</th>
                <th>Actions</th>

            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>
                <td th:text="${product.productName}"></td>
                <td th:text="${product.productPrice}"></td>
                <td th:text="${product.productQuantity}"></td>
                <td th:text="${product.productSKU}"></td>
                <!-- TODO: display button actions based on viewer role -->

                <td sec:authorize="hasRole('ADMIN')">
                    <!-- TODO: Implement product delete POST endpoint -->
                    <form th:action="@{/products/delete/{id}(id=${product.id})}" method="post">
                        <button type="submit">Delete</button>
                    </form>
                </td>

                <td sec:authorize="isAuthenticated()">
                    <!-- TODO: Implement product purchase POST endpoint -->
                    <form th:action="@{/products/purchase/{id}(id=${product.id})}" method="post">
                        <button type="submit">Purchase</button>
                    </form>
                </td>
            </tr>
        </tbody>
        <div class="successMessage">
            <span th:if="${successMessage}" th:text="${successMessage}"></span>
        </div>
    </table>
    <!-- TODO: Add product catalog pagination features -->
    <div th:replace="~{fragments/fragments :: site-footer}"></div>


</body>

</html>
