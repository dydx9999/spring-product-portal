<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="site-page">
    <div th:replace="~{fragments/fragments :: site-navigation('')}"></div>
    <main class="container py-4">
        <header class="mb-4">
            <p class="page-eyebrow text-uppercase small fw-semibold mb-2">Account</p>
            <h1 class="h2 mb-2">Your dashboard</h1>
            <p class="text-secondary mb-0">Welcome, <span th:text="${username}">User</span>.</p>
        </header>
        <div class="row g-3">
            <div class="col-12 col-md-6">
                <section class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h6 text-secondary">Account balance</h2>
                        <p class="display-6 mb-0">$<span th:text="${balance}">0.00</span></p>
                    </div>
                </section>
            </div>
            <div class="col-12 col-md-6">
                <section class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h6 text-secondary">Account type</h2>
                        <p class="h4 mb-0" th:text="${role}">Account role</p>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <footer class="container py-3">
        <div th:replace="~{fragments/fragments :: site-footer}"></div>
    </footer>
</body>

</html>
