<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Your Payment Methods</title>
        <link rel="stylesheet"
            th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>

    <body class="site-page">
        <div
            th:replace="~{fragments/fragments :: site-navigation('payment-add')}"></div>
        <main class="container py-4">
            <header class="mb-4">
                <p
                    class="page-eyebrow text-uppercase small fw-semibold mb-2">Payments</p>
                <h1 class="h2 mb-2">Your payments</h1>
                <p class="text-secondary mb-0">Manage your payment details.</p>
            </header>
            <div class="container my-4">
                <span class="alert alert-success" th:if="${successMessage}"
                    th:text="${successMessage}">Message</span>
            </div>
            <form th:object=${paymentForm}
                class="row g-3 needs-validation" method="post">
                <div class="col-md-4">
                    <label for="cardNumber" class="form-label">Card
                        Number</label>
                    <input type="text" class="form-control"
                        th:field="*{cardNumber}"
                        required>

                </div>
                <div class="col-md-4">
                    <label for="validationCustom02" class="form-label">Card CVV
                    </label>
                    <input type="text" class="form-control"
                        th:field="*{cvv}"
                        required>
                </div>

                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value
                            id="invalidCheck" required>
                        <label class="form-check-label" for="invalidCheck">
                            Agree to terms and conditions
                        </label>
                        <div class="invalid-feedback">
                            You must agree before submitting.
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Add
                        payment method</button>
                </div>
            </form>
        </main></body></html>
