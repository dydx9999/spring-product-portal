<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Order Confirmation</title>
        <link rel="stylesheet"
            th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>

    <body class="site-page">
        <div
            th:replace="~{fragments/fragments :: site-navigation('cart')}"></div>
        <main class="container py-4">
            <!-- Order confirmation details -->
            <header class="mb-4">
                <p
                    class="page-eyebrow text-uppercase small fw-semibold mb-2">Order
                    confirmed!</p>
                <h1 class="h2 mb-2">Your order confirmation number:<strong>
                        <span
                            th:text="| #${orderDetails.orderId}|">orderId</span>
                    </strong></h1>
                <p class="text-secondary mb-0">Placed at <span
                        th:text="${#temporals.format(orderDetails.creationDate, 'EEEE, MMMM d, yyyy ''at'' h:mm a')}"></span>
                </p>
            </header>

            <section class="card border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover site-table mb-0 table-sm">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">Product</th>
                                <th scope="col">Quantity</th>
                                <th scope="col">Unit price</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${orderDetails.items}">
                                <td th:text="${item.productName}"></td>
                                <td th:text="${item.quantity}"></td>
                                <td>$<span
                                        th:text="${item.unitPrice}"></span></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(orderDetails.items)}">
                                <td colspan="3">No line items found for this
                                    order.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <a class="btn btn-outline-primary mt-3" th:href="@{/orders}">View
                order history</a>
        </main>
        <footer class="container py-3">
            <div th:replace="~{fragments/fragments :: site-footer}"></div>
        </footer>

    </body>

</html>
