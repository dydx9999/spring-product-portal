<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="site-page">
    <div th:replace="~{fragments/fragments :: site-navigation('orders')}"></div>
    <main class="container py-4">
        <header class="mb-4">
            <p class="page-eyebrow text-uppercase small fw-semibold mb-2">Orders</p>
            <h1 class="h2 mb-2">Your order history: <strong><span th:text="${username}"></span></strong></h1>
            <p class="text-secondary mb-0">Review your previous orders.</p>
        </header>
        <!-- Order history table -->
        <div class="table-responsive">
            <table class="table table-striped site-table mb-0">
                <thead class="table-light">
                    <tr>
                        <th scope="col">Order ID</th>
                        <th scope="col">Vendor Id</th>
                        <th scope="col">Date placed</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orderSummary}">
                        <td th:text="${order.orderId}"></td>
                        <td><span th:text="${order.vendorId}"></span></td>
                        <td th:text="${#temporals.format(order.creationDate, 'EEEE, MMMM d, yyyy ''at'' h:mm a')}"></td>
                        <td>
                            <form th:action="@{/orders/view/{orderId}(orderId=${order.orderId})}" method="get"><button
                                    type="submit">View
                                    details</button></form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>
    <footer class="container py-3">
        <div th:replace="~{fragments/fragments :: site-footer}"></div>
    </footer>

</body>

</html>
