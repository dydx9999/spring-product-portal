<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="|Product Wishlist - ${currentUser.username}|">Product
            Wishlist</title>
        <link rel="stylesheet"
            th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>

    <body class="site-page">
        <div
            th:replace="~{fragments/fragments :: site-navigation('wishlist')}"></div>
        <main class="container py-4">
            <header
                class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
                <div>
                    <p
                        class="page-eyebrow text-uppercase small fw-semibold mb-2">Saved
                        items</p>
                    <h1 class="h2 mb-2">Your wishlist</h1>
                    <p class="text-secondary mb-0">
                        <span th:text="${#lists.size(wishlistItems)}">0</span>
                        <span
                            th:text="${#lists.size(wishlistItems) == 1 ? 'product' : 'products'}">products</span>
                        saved for <strong
                            th:text="${currentUser.username}">username</strong>
                    </p>
                </div>
                <a class="btn btn-outline-primary" th:href="@{/products}">Browse
                    products</a>
            </header>

            <div th:if="${successMessage}" class="alert alert-success"
                role="status"
                th:text="${successMessage}"></div>
            <div th:if="${outOfStockMessage}" class="alert alert-warning"
                role="status"
                th:text="${outOfStockMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert"
                th:text="${errorMessage}"></div>

            <section class="card border-0 shadow-sm"
                aria-label="Wishlist products">
                <div class="table-responsive">
                    <table class="table table-hover site-table mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">Product</th>
                                <th scope="col">Vendor</th>
                                <th scope="col" class="text-end">Price</th>
                                <th scope="col"
                                    class="text-end">Availability</th>
                                <th scope="col">SKU</th>
                                <th scope="col"
                                    class="actions-column">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="entry : ${wishlistItems}">
                                <th scope="row">
                                    <a th:if="${entry.product != null}"
                                        th:href="@{/products/view/{id}(id=${entry.productId})}"
                                        th:text="${entry.product.productName}">Product
                                        name</a>
                                    <span th:unless="${entry.product != null}"
                                        class="text-secondary">
                                        Unavailable product <span
                                            th:text="${entry.productId}">0</span>
                                    </span>
                                </th>
                                <td
                                    th:text="${entry.product != null and entry.product.vendorName != null ? entry.product.vendorName : 'Unassigned'}">Vendor</td>
                                <td class="text-end">
                                    <span th:if="${entry.product != null}"
                                        th:text="|$${#numbers.formatDecimal(entry.product.productPrice, 1, 2)}|">$0.00</span>
                                    <span th:unless="${entry.product != null}"
                                        class="text-secondary">&mdash;</span>
                                </td>
                                <td class="text-end">
                                    <span
                                        th:if="${entry.product != null and entry.product.productQuantity > 0}"
                                        class="badge text-bg-success">In
                                        stock</span>
                                    <span
                                        th:if="${entry.product != null and entry.product.productQuantity <= 0}"
                                        class="badge text-bg-danger">Out of
                                        stock</span>
                                    <span th:unless="${entry.product != null}"
                                        class="text-secondary">Unavailable</span>
                                </td>
                                <td>
                                    <code th:if="${entry.product != null}"
                                        class="sku-code"
                                        th:text="${entry.product.productSKU}">SKU</code>
                                    <span th:unless="${entry.product != null}"
                                        class="text-secondary">&mdash;</span>
                                </td>
                                <td class="actions-column">
                                    <div class="wishlist-actions">
                                        <form
                                            th:if="${entry.product != null and entry.product.productQuantity > 0}"
                                            th:action="@{/products/purchase/{id}(id=${entry.productId})}"
                                            method="post">
                                            <input type="hidden"
                                                name="returnToWishlist"
                                                value="true">
                                            <input type="hidden" name="quantity"
                                                value="1">
                                            <button type="submit"
                                                class="btn btn-sm btn-success">Add
                                                to cart</button>
                                        </form>
                                        <form
                                            th:action="@{/products/wishlist/remove/{id}(id=${entry.productId})}"
                                            method="post">
                                            <button type="submit"
                                                class="btn btn-sm btn-outline-danger">Remove</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(wishlistItems)}">
                                <td colspan="6"
                                    class="text-center text-secondary py-5">
                                    Your wishlist is empty.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <footer class="container py-3">
            <div th:replace="~{fragments/fragments :: site-footer}"></div>
        </footer>

    </body>
</html>
