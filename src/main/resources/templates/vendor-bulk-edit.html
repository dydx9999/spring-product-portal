<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">
        <title>Vendor Product Bulk Edit</title>
        <link rel="stylesheet"
              th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
        <link rel="stylesheet"
              th:href="@{/css/styles.css}">
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
        <script th:src="@{/js/vendor-bulk-edit.js}"
                defer></script>
    </head>

    <body class="site-page">
        <div th:replace="~{fragments/fragments :: site-navigation('vendor-bulk-edit')}"></div>
        <main class="container py-4">
            <h1 class="display-7">Bulk Editing</h1>
            <section class="bulk-edit-table">
                <form th:action="@{/vendor/bulk/edit}"
                      method="post">
                    <table class="table table-responsive table-sm">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Name</th>
                                <th scope="col">Price</th>
                                <th scope="col">SKU</th>
                                <th scope="col">Quantity</th>
                            </tr>
                        </thead>
                        <tr class="product-row"
                            th:each=" product : ${vendorProducts}">
                            <td th:text="${product.id}"></td>
                            <td>
                                <input type="text"
                                       th:value="${product.productName}"
                                       size="50">
                            </td>
                            <td>
                                <input class="price-input"
                                       type="number"
                                       name=""
                                       id=""
                                       th:value="${product.productPrice}"
                                       size=>
                            </td>
                            <td>
                                <input type="text"
                                       name=""
                                       id=""
                                       th:value="${product.productSKU}"
                                       size="15">
                            </td>
                            <td>
                                <input class="quantity-input"
                                       type="number"
                                       name=""
                                       id=""
                                       th:value="${product.productQuantity}"
                                       size="2">
                            </td>
                        </tr>
                    </table>
                    <button type="submit"
                            class="btn btn-success">Save Changes</button>
                    <a th:href="@{/vendor}"
                       class="btn btn-secondary">Go back</a>
                </form>
            </section>
        </main>
        <footer class="container py-3">
            <div th:replace="~{fragments/fragments :: site-footer}"></div>
        </footer>
    </body>

</html>
