<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Catalog</title>
        <link rel="stylesheet"
            th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">

        <link rel="stylesheet" th:href="@{/css/styles.css}">
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    </head>
    <body class="site-page">
        <div
            th:replace="~{fragments/fragments :: site-navigation('products')}"></div>
        <main class="container py-4 py-lg-5">
            <header class="mb-4 mb-lg-5">
                <p class="page-eyebrow text-uppercase small fw-semibold mb-2">
                    Catalog <span class="mx-1" aria-hidden="true">/</span>
                    Product details / <span
                        th:text="${product.productName}"></span>
                </p>
                <h1 class="display-6 fw-semibold mb-0">
                    <span th:text="${product.productName}">Product Name</span>
                    <span
                        class="badge rounded-pill text-bg-light border px-3 py-2 text-warning bi bi-star-fill"
                        aria-label="star"
                        th:if="${averageRating != null}"
                        th:text="${#numbers.formatDecimal(averageRating, 1, 2)}">
                    </span> <span
                        class="badge rounded-pill text-bg-danger border px-3 py-2 text-warning bi bi-fire"
                        th:if="${unitsSold >= 0}"
                        th:text="|${unitsSold} sold|"></span></h1>
            </header>
            <section class="card border-0 shadow-sm overflow-hidden"
                aria-label="Product details">
                <div class="row g-0">
                    <div class="col-md-5 col-lg-4">
                        <div
                            class="h-100 min-vh-25 d-flex flex-column justify-content-between p-4 p-lg-5 text-white"
                            style="min-height: 280px; background: linear-gradient(145deg, #1d3557, #457b9d);">
                            <span
                                class="badge rounded-pill bg-white text-primary align-self-start px-3 py-2">Product</span>
                            <div>
                                <p
                                    class="small text-uppercase fw-semibold mb-2 opacity-75">Catalog
                                    item</p>
                                <p class="h3 fw-semibold mb-0"
                                    th:text="${product.productName}">Product
                                    Name</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-7 col-lg-8">
                        <div class="card-body p-4 p-lg-5">
                            <p
                                class="text-uppercase small fw-semibold text-secondary mb-2">Product
                                overview</p>
                            <h2 class="h3 mb-4"
                                th:text="${product.productName}">Product
                                Name</h2>
                            <dl class="row mb-0">
                                <div>
                                    <dt
                                        class="col-sm-3 text-secondary fw-semibold">Vendor</dt>
                                    <dd class="col-sm-9 mb-0">
                                        <span
                                            class="badge  rounded-pill text-bg-primary border px-3 py-2"
                                            th:text="${product.vendorName}">Vendor
                                            Name</span>
                                    </dd>
                                </div>
                                <div>
                                    <dt
                                        class="col-sm-3 text-secondary fw-semibold">Price</dt>
                                    <dd class="col-sm-9 mb-0">
                                        <span
                                            class="badge rounded-pill text-bg-success border px-3 py-2">$<span
                                                th:text="${product.productPrice}">Price</span></span>
                                    </dd>
                                    <!-- Single product average rating stats -->
                                    <dt
                                        class="col-sm-3 text-secondary fw-semibold">Average
                                        Rating:</dt> <div>
                                        <dd class="col-sm-9 mb-0">
                                            <span
                                                class="badge rounded-pill text-bg-light border px-3 py-2 text-warning bi bi-star-fill"
                                                aria-label="star"
                                                th:if="${averageRating != null}"
                                                th:text="${#numbers.formatDecimal(averageRating, 1, 2)}">

                                            </span>
                                        </dd>
                                        <dd class="col-sm-9 mb-0 bi bi-star"
                                            th:unless="${averageRating != null}">
                                            No reviews yet
                                        </dd>
                                    </div>
                                    <!-- Single product sales history / stats -->
                                    <dt
                                        class="col-sm-3 text-secondary fw-semibold">Sales
                                        History:</dt> <div>
                                        <dd class="col-sm-9 mb-0">
                                            <span
                                                class="badge rounded-pill text-bg-danger border px-3 py-2 text-warning bi bi-fire"
                                                th:if="${unitsSold >= 0}"
                                                th:text="|All time: ${unitsSold}|">
                                            </span>
                                        </dd>
                                        <dd class="col-sm-9 mb-0 bi bi-star"
                                            th:unless="${unitsSold >= 0}">
                                            No sales yet
                                        </dd>
                                    </div>
                                    <!--User only add to cart action button-->
                                    <dd class="col-sm-9 mb-0 text-end">
                                        <form class="product-action-form"
                                            sec:authorize="hasRole('USER')"
                                            th:if="${product.productQuantity > 0}"
                                            th:action="@{/products/purchase/{id}(id=${product.id})}"
                                            method="post">
                                            <div class="mb-3">
                                                <label for
                                                    class="form-label">Quantity:</label>
                                                <input
                                                    type="number"
                                                    min="1"
                                                    th:attr="max=${product.productQuantity}"
                                                    class="form-control form-control-sm"
                                                    name="quantity"
                                                    placeholder="1"
                                                    value="1" />
                                                <small id="helpId"
                                                    class="form-text text-body-secondary">
                                                    <span
                                                        th:text="${product.productQuantity}"></span>
                                                    available.</small><div>
                                                    <button
                                                        class="btn btn-success bi bi-cart4 add-to-cart-button"
                                                        type="submit"> Add
                                                        to
                                                        cart
                                                    </button>

                                                </div>
                                            </div>
                                        </form>
                                        <form
                                            sec:authorize="hasRole('USER')"
                                            th:action="@{/products/wishlist/add/{productId}(productId=${product.id})}"
                                            method="post"><button
                                                type="submit"
                                                class="btn btn-sm
                                                btn-outline-warning"><span
                                                    class="bi bi-star-fill text-warning"></span>Add
                                                to wishlist</button></form>
                                    </dd>
                                </div>
                            </dl>
                        </div>
                    </div>
                    <section class="col-12 mt-4"
                        aria-labelledby="reviews-heading">
                        <h2 class="display-7 fw-semibold mb-0"
                            id="reviews-heading">
                            See what buyers are saying
                            (<span
                                th:text="${#lists.size(productReviews)}">0</span>)
                        </h2>
                        <div class="table-responsive">
                            <table th:unless="${#lists.isEmpty(productReviews)}"
                                class="table table-striped">
                                <thead>
                                    <tr>
                                        <th scope="col">Comment</th>
                                        <th scope="col">Buyer</th>
                                        <th scope="col">Rating</th>
                                        <th scope="col">Reviewed on</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr
                                        th:each="review : ${productReviews}">
                                        <td
                                            th:text="${review.comment ?: 'No comment provided.'}"></td>
                                        <td
                                            th:text="${review.username}"></td>
                                        <td>
                                            <span
                                                th:each="star : ${#numbers.sequence(1, 5)}"
                                                th:class="${review.rating != null and star <= review.rating}
                                                      ? 'bi bi-star-fill text-warning'
                                                      : 'bi bi-star text-secondary'"
                                                aria-hidden="true"></span>
                                        </td>
                                        <td
                                            th:text="${#temporals.format(review.createdAt,
                                            'MMMM d, yyyy ''at'' h:mm a')}">

                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <span
                                th:if="${#lists.isEmpty(productReviews)}">No
                                reviews yet.</span>
                        </div>
                    </section>
                </div>
            </section>
        </main>
    </body>
</html>
