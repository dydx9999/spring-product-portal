<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Creation Form</title>
</head>

<body>
    <p th:if="${param.error}" style="color: red;">Invalid product value</p>

    <div class="product-form">
        <form th:action="@{/products/product-form}" th:object="${productForm}" method="post">
            <p>Product Name:</p>
            <input type="text" th:field="*{productName}">
            <p>Product Price:</p>
            <input type="number" th:field="*{productPrice}">
            <p>Product Quantity:</p>
            <input type="number" th:field="*{availableQuantity}">
            <button type="submit">Add product</button>
        </form>
    </div>
</body>

</html>
