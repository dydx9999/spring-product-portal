<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Creation Form</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <div th:replace="~{fragments/fragments :: site-navigation('add-product')}"></div>
    <div>
        <form th:action=" @{/products/add-product}" th:object="${productForm}" method="post">
            <p>Product Name:</p>
            <input type="text" th:field="*{productName}">
            <p>Product Price:</p>
            <input type="number" th:field="*{productPrice}">
            <p>Product Quantity:</p>
            <input type="number" th:field="*{productQuantity}">
            <button type="submit">Add product</button>
        </form>
    </div>
    <div class="statusMessage">
        <p th:if="${successMessage}" th:text="${successMessage}" style="color : green;"></p>
        <p th:if="${errorMessage}" th:text="${errorMessage}" style="color : red;"></p>
    </div>
    <div th:replace="~{fragments/fragments :: site-footer}"></div>

</body>

</html>
