<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Product Portal</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="site-page">
    <div th:replace="~{fragments/fragments :: site-navigation('')}"></div>
    <main class="container py-4">
        <header class="mb-4">
            <p class="page-eyebrow text-uppercase small fw-semibold mb-2">Workspace</p>
            <h1 class="h2 mb-2">Spring Product Portal</h1>
            <p class="text-secondary mb-0">Choose where you want to continue.</p>
        </header>
        <div class="row g-3">
            <div class="col-12 col-md-6">
                <section class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5">Product catalog</h2>
                        <p class="text-secondary">Browse available products.</p>
                        <a th:href="@{/products}" class="btn btn-primary">Open catalog</a>
                    </div>
                </section>
            </div>
            <div class="col-12 col-md-6">
                <section class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5">Account</h2>
                        <p class="text-secondary">Sign in or create an account.</p>
                        <div class="d-flex flex-wrap gap-2">
                            <a th:href="@{/login}" class="btn btn-outline-secondary">Sign in</a>
                            <a th:href="@{/register}" class="btn btn-outline-secondary">Register</a>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <footer class="container py-3">
        <div th:replace="~{fragments/fragments :: site-footer}"></div>
    </footer>
</body>

</html>
