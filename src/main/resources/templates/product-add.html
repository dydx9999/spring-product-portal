<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add Product</title>
        <link rel="stylesheet"
            th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/css/styles.css}">
        <script th:src="@{/js/product-add.js}" defer></script>
    </head>

    <body class="site-page">
        <div
            th:replace="~{fragments/fragments :: site-navigation('product-add')}"></div>

        <main class="container py-4">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8 col-xl-7">
                    <!-- Product creation heading -->
                    <div class="mb-4">
                        <p
                            class="page-eyebrow text-uppercase small fw-semibold mb-2">Inventory</p>
                        <h1 class="h2 mb-2">Add a product</h1>
                        <p class="text-secondary mb-0">Enter the product details
                            to add it to your catalog.</p>
                    </div>

                    <!-- Product form status messages -->
                    <div th:if="${successMessage}" class="alert alert-success"
                        role="status" th:text="${successMessage}">
                    </div>
                    <div th:if="${errorMessage}" class="alert alert-danger"
                        role="alert" th:text="${errorMessage}"></div>

                    <!-- Product details form -->
                    <section class="card border-0 shadow-sm">
                        <div class="card-body p-4 p-md-5">
                            <form th:action="@{/products/product-add}"
                                th:object="${productForm}" method="post"
                                class="site-form">
                                <div class="mb-4">
                                    <div class="form-floating">
                                        <input id="productName" type="text"
                                            class="form-control"
                                            placeholder=" "
                                            aria-describedby="productNameCharacterCount"
                                            th:field="*{productName}">
                                        <label for="productName">Product
                                            name</label>
                                    </div>
                                    <div id="productNameCharacterCount"
                                        class="form-text" aria-live="polite">
                                        250 characters remaining
                                    </div>
                                </div>

                                <div class="row g-3 mb-4">
                                    <div class="col-12 col-sm-7">
                                        <div class="input-group">
                                            <span
                                                class="input-group-text">$</span>
                                            <div class="form-floating">
                                                <input id="productPrice"
                                                    type="number" min="0"
                                                    step="0.01"
                                                    class="form-control"
                                                    placeholder="0.00"
                                                    th:field="*{productPrice}">
                                                <label for="productPrice">Unit
                                                    price</label>
                                            </div>
                                        </div>
                                        <div class="form-text">Price per
                                            item.</div>
                                    </div>
                                    <div class="col-12 col-sm-5">
                                        <div class="form-floating">
                                            <input id="productQuantity"
                                                type="number" min="0" step="1"
                                                class="form-control"
                                                placeholder="0"
                                                th:field="*{productQuantity}">
                                            <label
                                                for="productQuantity">Quantity</label>
                                        </div>
                                        <div class="form-text">Units in
                                            stock.</div>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-text"
                                            aria-live="polite">
                                            Line total:
                                            <output id="lineTotal"
                                                for="productPrice productQuantity">Enter
                                                price and quantity</output>
                                        </div>
                                    </div>
                                    <div class="col-12 col-sm-7">
                                        <div class="form-floating">
                                            <input id="lowStockThreshold"
                                                type="number" min="0"
                                                class="form-control"
                                                placeholder=" "
                                                th:field="*{lowStockThreshold}">
                                            <label for="lowStockThreshold">Low
                                                stock threshold</label>
                                        </div>
                                        <div class="form-text">Set an alert when
                                            product stock falls below a certain
                                            level.</div>
                                    </div>
                                    <div class="col-12 col-sm-12">
                                        <div class="form-floating">
                                            <input id="productSKU" type="text"
                                                class="form-control"
                                                placeholder=" "
                                                th:field="*{productSKU}">
                                            <label for="productSKU">Product
                                                SKU</label>
                                        </div>
                                        <div class="form-text">Leave blank to
                                            generate a SKU.</div>
                                    </div>
                                    <div class="warehouse-container">
                                        <div
                                            class="mb-4 form-floating warehouse-location">
                                    <select
                                        id="warehouseLocation"
                                        class="form-select"
                                                th:field="*{warehouseId}"
                                                required>
                                                <option th:value disabled>Choose
                                                    a
                                            warehouse</option>
                                        <option
                                            th:each="warehouse : ${warehouses}"
                                            th:value="${warehouse.id}"
                                            th:text="${warehouse.warehouseName}">Warehouse</option>

                                    </select>

                                            <label
                                                for="warehouseLocation">Warehouse
                                                location
                                            </label>

                                        </div>
                                    </div>
                                    <button
                                        class="warehouse-add-button btn btn-primary"
                                        type="button">Add
                                        warehouse</button>
                                </div>
                                <div class="form-group mb-4">
                                    <label
                                        for="vendorNotes"
                                        class="form-label">Optional
                                        notes</label>
                                    <textarea
                                        class="form-control"
                                        id="vendorNotes"
                                        rows="3"
                                        th:field="*{vendorNotes}"></textarea>
                                </div>

                                <div
                                    class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2">
                                    <a
                                        th:href="@{/products}"
                                        class="btn btn-outline-secondary">Cancel</a>
                                    <button type="submit"
                                        class="btn btn-primary px-4">Add
                                        product</button>
                                </div>
                            </form>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <footer class="container py-3">
            <div
                th:replace="~{fragments/fragments :: site-footer}"></div>
        </footer>

    </body>

</html>
