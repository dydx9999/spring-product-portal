<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add Product</title>
        <link rel="stylesheet"
            th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>

    <body class="site-page">
        <div
            th:replace="~{fragments/fragments :: site-navigation('product-add')}"></div>

        <main class="container py-4">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8 col-xl-7">
                    <!-- Product creation heading -->
                    <div class="mb-4">
                        <p
                            class="page-eyebrow text-uppercase small fw-semibold mb-2">Inventory</p>
                        <h1 class="h2 mb-2">Add a product</h1>
                        <p class="text-secondary mb-0">Enter the product details
                            to add it to your catalog.</p>
                    </div>

                    <!-- Product form status messages -->
                    <div th:if="${successMessage}" class="alert alert-success"
                        role="status" th:text="${successMessage}">
                    </div>
                    <div th:if="${errorMessage}" class="alert alert-danger"
                        role="alert" th:text="${errorMessage}"></div>

                    <!-- Product details form -->
                    <section class="card border-0 shadow-sm">
                        <div class="card-body p-4 p-md-5">
                            <form th:action="@{/products/product-add}"
                                th:object="${productForm}" method="post"
                                class="site-form">
                                <div class="mb-4">
                                    <label for="productName"
                                        class="form-label fw-semibold">Product
                                        name</label>
                                    <input id="productName" type="text"
                                        class="form-control form-control-lg"
                                        placeholder="e.g. Everyday tote bag"
                                        th:field="*{productName}" required>
                                </div>

                                <div class="row g-3 mb-4">
                                    <div class="col-12 col-sm-7">
                                        <label for="productPrice"
                                            class="form-label fw-semibold">Unit
                                            price</label>
                                        <div class="input-group input-group-lg">
                                            <span
                                                class="input-group-text">$</span>
                                            <input id="productPrice"
                                                type="number" min="0"
                                                step="0.01" class="form-control"
                                                placeholder="0.00"
                                                th:field="*{productPrice}"
                                                required>
                                        </div>
                                        <div class="form-text">Price per
                                            item.</div>
                                    </div>
                                    <div class="col-12 col-sm-5">
                                        <label for="productQuantity"
                                            class="form-label fw-semibold">Quantity</label>
                                        <input id="productQuantity"
                                            type="number" min="0" step="1"
                                            class="form-control form-control-lg"
                                            placeholder="0"
                                            th:field="*{productQuantity}"
                                            required>
                                        <div class="form-text">Units in
                                            stock.</div>
                                    </div>
                                    <div class="col-12 col-sm-7">
                                        <label for="lowStockThreshold"
                                            class="form-label fw-semibold">Low
                                            stock threshold</label>
                                        <div class="input-group input-group-lg">

                                            <input id="lowStockThreshold"
                                                type="number" min="0"
                                                class="form-control"
                                                placeholder="5"
                                                th:field="*{lowStockThreshold}"
                                                required>
                                        </div>
                                        <div class="form-text">Set an alert when
                                            product stock falls below a certain
                                            level.</div>
                                    </div>
                                    <div class="col-12 col-sm-12">
                                        <label for="productSKU"
                                            class="form-label fw-semibold">Product
                                            SKU</label>
                                        <input id="productSKU" type="text"
                                            class="form-control form-control-lg"
                                            placeholder="Enter a SKU or leave blank to have it randomly generated."
                                            th:field="*{productSKU}">

                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label for="warehouseLocation"
                                        class="form-label fw-semibold">Warehouse
                                        Location</label>
                                    <select
                                        id="warehouseLocation"
                                        class="form-select"
                                        th:field="*{warehouseId}" required>

                                        <option th:value="''">Choose a
                                            warehouse
                                            location...</option>

                                        <option
                                            th:each="warehouse : ${warehouses}"
                                            th:value="${warehouse.id}"
                                            th:text="${warehouse.warehouseName}">Warehouse</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label
                                        for="vendorNotes">Optional
                                        notes</label>
                                    <textarea
                                        class="form-control"
                                        id="vendorNotes"
                                        rows="3"
                                        th:field="*{vendorNotes}"></textarea>
                                </div>

                                <div
                                    class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2">
                                    <a
                                        th:href="@{/products}"
                                        class="btn btn-outline-secondary">Cancel</a>
                                    <button type="submit"
                                        class="btn btn-primary px-4">Add
                                        product</button>
                                </div>
                            </form>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <footer class="container py-3">
            <div
                th:replace="~{fragments/fragments :: site-footer}"></div>
        </footer>

    </body>

</html>
