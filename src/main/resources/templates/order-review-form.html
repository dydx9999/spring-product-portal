<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Leave a Review</title>
        <link rel="stylesheet"
            th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>

    <body class="site-page">
        <div
            th:replace="~{fragments/fragments :: site-navigation('orders')}"></div>
        <main class="container py-4">
            <header class="mb-4">
                <p
                    class="page-eyebrow text-uppercase small fw-semibold mb-2">Your
                    order</p>
                <h1 class="h2 mb-2">Order: <strong>#<span
                            th:text="${orderDetails.orderId}"></span></strong></h1>
                <p class="text-secondary mb-0">Placed at <span
                        th:text="${#temporals.format(orderDetails.creationDate, 'EEEE, MMMM d, yyyy ''at'' h:mm a')}"></span>
                </p>
            </header>
            <!-- Order line items -->
            <div class="table-responsive">
                <table class="table table-striped site-table mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Product</th>
                            <th scope="col">Quantity</th>
                            <th scope="col">Unit price</th>
                            <th scope="col">Vendor</th>
                            <th scope="col">Line total</th>
                            <th scope="col">Review</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item, itemStat : ${orderDetails.items}">
                            <td th:text="${item.productName}"></td>
                            <td th:text="${item.quantity}"></td>
                            <td>$<span
                                    th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}"></span></td>
                            <td th:text="${item.vendorBusinessName}"></td>
                            <td>$<span
                                    th:text="${#numbers.formatDecimal(item.unitPrice * item.quantity, 1, 2)}"></span></td>
                            <td><form th:action="@{/orders/review}"
                                    method="post"
                                    th:object="${reviewForm}">
                                    <input type="hidden" name="orderId"
                                        th:value="${reviewForm.orderId}">
                                    <input type="hidden" name="orderItemId"
                                        th:value="${item.id}">
                                    <fieldset class="star-rating">
                                        <legend
                                            class="visually-hidden">Rating</legend>
                                        <input type="radio" name="rating"
                                            value="5"
                                            th:id="|rating-${itemStat.index}-5|"
                                            aria-label="5 stars">
                                        <label
                                            th:for="|rating-${itemStat.index}-5|"
                                            title="5 stars">★</label>
                                        <input type="radio" name="rating"
                                            value="4"
                                            th:id="|rating-${itemStat.index}-4|"
                                            aria-label="4 stars">
                                        <label
                                            th:for="|rating-${itemStat.index}-4|"
                                            title="4 stars">★</label>
                                        <input type="radio" name="rating"
                                            value="3"
                                            th:id="|rating-${itemStat.index}-3|"
                                            aria-label="3 stars">
                                        <label
                                            th:for="|rating-${itemStat.index}-3|"
                                            title="3 stars">★</label>
                                        <input type="radio" name="rating"
                                            value="2"
                                            th:id="|rating-${itemStat.index}-2|"
                                            aria-label="2 stars">
                                        <label
                                            th:for="|rating-${itemStat.index}-2|"
                                            title="2 stars">★</label>
                                        <input type="radio" name="rating"
                                            value="1"
                                            th:id="|rating-${itemStat.index}-1|"
                                            aria-label="1 star">
                                        <label
                                            th:for="|rating-${itemStat.index}-1|"
                                            title="1 star">★</label>
                                    </fieldset>
                                    <button class="btn btn-sm btn-primary mt-2"
                                        type="submit">Submit</button>
                                </form></td>
                        </tr>
                        <tr
                            th:if="${#lists.isEmpty(orderDetails.items)}">
                            <td colspan="5">No line items found for this
                                order.</td>
                        </tr>

                    </tbody>
                    <tfoot>
                        <tr>
                            <th colspan="4" class="text-end"
                                scope="row">Grand
                                total:</th>
                            <td>$<span
                                    th:text="${#numbers.formatDecimal(orderDetails.total, 1, 2)}">0.00</span></td>
                        </tr>
                    </tfoot>

                </table>

            </div>

        </main>
        <footer class="container py-3">
            <div
                th:replace="~{fragments/fragments :: site-footer}"></div>
        </footer>

    </body>

</html>
