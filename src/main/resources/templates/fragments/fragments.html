<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>

    </head>

    <body>
        <div th:fragment="site-navigation(activePage)">
            <nav class="site-navigation" aria-label="Main navigation">
                <div
                    class="container py-3 d-flex flex-wrap justify-content-between align-items-center gap-3">
                    <ul class="nav nav-pills gap-2 mb-0">
                        <li class="nav-item">
                            <a class="nav-link" th:if="${isVendor}"
                                th:classappend="${activePage == 'vendor-dashboard'} ? 'active' : ''"
                                th:href="@{/vendor}">View vendor
                                dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link"
                                th:classappend="${activePage == 'products'} ? 'active' : ''"
                                th:href="@{/products}">View product catalog</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:if="${isVendor}"
                                th:classappend=" ${activePage=='add-product' } ? 'active'
                            : ''" th:href=" @{/products/add-product}">Add new
                                product</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link"
                                th:classappend="${activePage == 'product-search'} ? 'active' : ''"
                                th:href="@{/products/product-search}">Search for
                                a product</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                                th:classappend="${activePage == 'cart'} ? 'active' : ''"
                                th:href="@{/cart/view}">View
                                cart</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link"
                                th:classappend="${activePage == 'orders'} ? 'active' : ''"
                                th:href="@{/orders}">My
                                orders</a>
                        </li>
                        <li class="nav-item">
                            <form th:action="@{/logout}" method="post"
                                class="m-0">
                                <button class="nav-link"
                                    type="submit">Logout</button>
                            </form>
                        </li>

                    </ul>
                    <a
                        class="d-flex align-items-center gap-2 text-decoration-none"
                        th:if="${signedIn}" th:href="@{/user/profile}"
                        aria-label="View signed-in user profile">
                        <span class="avatar-image" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"
                                    fill="currentColor" />
                            </svg>
                        </span>
                        <span class="d-flex flex-column">
                            <span class="fw-semibold"
                                th:text="${signedInUsername}">Username</span>
                            <small class="text-muted"
                                th:text="${signedInRole}">Role</small>
                        </span>
                    </a>
                </div>
            </nav>
        </div>
        <!-- A simple footer fragment -->
        <div th:fragment="site-footer">
            <p>&copy; 2026 Spring Product Portal. All rights reserved.</p>
        </div>

    </body>

</html>
