<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Cart</title>
        <link rel="stylesheet"
            th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>

    <body class="site-page">
        <div
            th:replace="~{fragments/fragments :: site-navigation('cart')}"></div>
        <main class="container py-4">
            <!-- Cart page header -->
            <header class="mb-4">
                <p
                    class="page-eyebrow text-uppercase small fw-semibold mb-2">Shopping</p>
                <h1 class="h2 mb-2">Your cart</h1>
                <p class="text-secondary mb-0">Review the products currently in
                    your cart.</p>
            </header>

            <!-- Cart success message -->
            <div th:if="${successMessage}" class="alert alert-success"
                role="status" th:text="${successMessage}"></div>
            <!-- Cart item list and actions -->
            <div class="card border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table table-striped site-table mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">Product ID</th>
                                <th scope="col">Product Name</th>
                                <th scope="col">Quantity</th>
                                <th scope="col">Unit Price</th>
                                <th scope="col">Total</th>
                                <th scope="col">Actions</th>

                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cartItem : ${cart}">
                                <td>
                                    <span
                                        th:text="${cartItem.productId}"></span>
                                    <span
                                        th:if="${products.get(cartItem.productId).productQuantity <= 0}"
                                        class="badge text-bg-warning">Out of
                                        stock!
                                    </span>

                                </td>
                                <td>
                                    <span
                                        th:text="${products.get(cartItem.productId).productName}"></span>
                                    <!-- <span class="badge badge-danger"> In:
                                    <span th:text=" ${distinctCarts[cartItem.productId]}">
                                    </span>
                                    user's carts
                                </span> -->

                                </td>
                                <td>
                                    <strong><span>x</span><span
                                            th:text="${cartItem.quantity}"></span></strong>
                                    <span>(</span><span
                                        th:text="${products.get(cartItem.productId).productQuantity}">
                                    </span> <span>available)</span>
                                </td>
                                <td>
                                    <p>$<span
                                            th:text="${products.get(cartItem.productId).productPrice}"></span>
                                        <span>/ea</span>
                                    </p>

                                </td>
                                <td>
                                    <span>$</span>
                                    <span
                                        th:text="${#numbers.formatDecimal(products.get(cartItem.productId).productPrice * cartItem.quantity, 1, 2)}"></span>

                                </td>
                                <td>
                                    <!-- Remove item or update its quantity -->
                                    <form
                                        th:action="@{/cart/delete/{id}(id=${cartItem.productId})}"
                                        method="post">
                                        <button type="submit"
                                            class="btn btn-primary">Remove
                                        </button>
                                    </form>
                                    <form class="d-flex gap-2 mt-2"
                                        th:action="@{/cart/update/{id}(id=${cartItem.productId})}"
                                        method="post">
                                        <input type="number"
                                            class="form-control text-center"
                                            style="max-width: 100px;"
                                            name="quantity"
                                            th:value="${cartItem.quantity}"
                                            min="1" required>
                                        <button type="submit"
                                            class="btn btn-outline-primary">Update</button>
                                    </form>
                                </td>

                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- Cart total and checkout action -->
            <div
                class="d-flex justify-content-end align-items-center gap-3 mt-3">
                <p class="mb-0 fw-semibold">
                    Total: $<span
                        th:text="${#numbers.formatDecimal(cartTotal, 1, 2)}"></span>
                </p>

                <a th:href="@{/cart/checkout}"> <button type="submit"
                        class="btn btn-primary">Checkout</button> </a>

            </div>

            <!-- Cart error message -->
            <div th:if="${errorMessage}" class="alert alert-danger mt-3"
                role="alert" th:text="${errorMessage}"></div>
        </main>
        <footer class="container py-3">
            <div th:replace="~{fragments/fragments :: site-footer}"></div>
        </footer>

    </body>

</html>
