<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cart</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="site-page">
    <div th:replace="~{fragments/fragments :: site-navigation('cart')}"></div>
    <main class="container py-4">
        <header class="mb-4">
            <p class="page-eyebrow text-uppercase small fw-semibold mb-2">Shopping</p>
            <h1 class="h2 mb-2">Your cart</h1>
            <p class="text-secondary mb-0">Review the products currently in your cart.</p>
        </header>

        <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped site-table mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Item #</th>
                            <th scope="col">Product ID</th>
                            <th scope="col">Quantity</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cartItem : ${cart}">
                            <td th:text="${cartItem.id}"></td>
                            <td><span th:text="${cartItem.productId}"></span></td>
                            <strong>
                                <td th:text="${cartItem.quantity}"></td>
                            </strong>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="d-flex justify-content-end mt-3">
            <button type="button" class="btn btn-primary" disabled>Checkout</button>
        </div>
    </main>
    <footer class="container py-3">
        <div th:replace="~{fragments/fragments :: site-footer}"></div>
    </footer>

</body>

</html>
